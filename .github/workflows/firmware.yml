name: Firmware Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install asset dependencies
        run: python -m pip install --disable-pip-version-check -r tools/requirements.txt

      - name: Verify scripts and web console
        run: |
          python -m py_compile \
            tools/generate_pet_assets.py \
            tools/verify_generated_assets.py \
            host/pager_cli.py
          node --check web/app.js

      - name: Verify generated assets are reproducible
        run: python tools/verify_generated_assets.py

  firmware:
    name: Zephyr 3.7.1 / nRF52840
    needs: source-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.13

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: app

      - name: Cache Zephyr workspace
        uses: actions/cache@v4
        with:
          path: |
            .west
            zephyr
            modules
            bootloader
            tools
          key: zephyr-3.7.1-${{ hashFiles('app/west.yml') }}

      - name: Initialize Zephyr workspace
        shell: bash
        run: |
          if [[ ! -d .west ]]; then
            west init -l app
          fi
          west update --narrow -o=--depth=1
          west zephyr-export

      - name: Configure Zephyr SDK
        shell: bash
        run: |
          sdk_dir="$(find /opt/toolchains -maxdepth 1 -type d \
            -name 'zephyr-sdk-0.16.*' -print | sort -V | tail -n 1)"
          if [[ -z "$sdk_dir" ]]; then
            echo "Zephyr SDK 0.16.x was not found in /opt/toolchains" >&2
            find /opt/toolchains -maxdepth 1 -type d -print >&2
            exit 1
          fi
          echo "Using Zephyr SDK: $sdk_dir"
          echo "ZEPHYR_SDK_INSTALL_DIR=$sdk_dir" >> "$GITHUB_ENV"

      - name: Build firmware
        shell: bash
        run: |
          west build -p always \
            -b promicro_nrf52840/nrf52840 \
            app \
            -- \
            -DBOARD_ROOT="$GITHUB_WORKSPACE/app"

      - name: Package firmware
        shell: bash
        run: |
          mkdir -p firmware
          cp build/zephyr/zephyr.elf firmware/AI-Code-Pager.elf
          cp build/zephyr/zephyr.hex firmware/AI-Code-Pager.hex
          cp build/zephyr/zephyr.bin firmware/AI-Code-Pager.bin
          cp build/zephyr/zephyr.uf2 firmware/AI-Code-Pager.uf2
          cp build/zephyr/zephyr.map firmware/AI-Code-Pager.map
          cp build/zephyr/.config firmware/zephyr.config
          cp build/zephyr/zephyr.dts firmware/zephyr.dts
          {
            echo "commit=$GITHUB_SHA"
            echo "workflow_run=$GITHUB_RUN_ID"
            echo "zephyr=v3.7.1"
            echo "board=promicro_nrf52840/nrf52840"
          } > firmware/build-info.txt
          (cd firmware && sha256sum * > SHA256SUMS.txt)

      - name: Upload firmware bundle
        uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Pager-${{ github.sha }}
          path: firmware/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Code-Pager-build-diagnostics-${{ github.sha }}
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/zephyr/.config
            build/zephyr/zephyr.dts
          if-no-files-found: ignore
          retention-days: 7
