name: Build Zephyr Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: 
      image: ghcr.io/zephyrproject-rtos/ci:v0.26.5
    env:
      # 显式指定 Zephyr SDK 的安装路径，解决 CMake 报错
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.16.5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize West Workspace
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Build Firmware (nRF52840)
        run: |
          west build -b nrf52840dk_nrf52840 app

      - name: Generate UF2 Package
        run: |
          python3 zephyr/scripts/build/uf2conv.py -c -b 0x1000 -f 0xADA52840 \
            build/zephyr/zephyr.hex -o build/zephyr/ai_pager.uf2

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AI_Pager_Firmware
          path: build/zephyr/ai_pager.uf2