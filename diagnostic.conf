# Minimal standalone LCD test. BLE, LVGL and the application are deliberately
# excluded so the UF2 only verifies power, wiring and the ST7789 SPI link.
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_BT=n
CONFIG_DISPLAY=n
CONFIG_LVGL=n
CONFIG_PM_DEVICE=n

CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n

CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_UF2=y
